# src/test/resources/application-test.properties
# Profile "test" (ativado via surefire no pom.xml) nao tem Mongo/Rabbit/Kafka reais
# disponiveis. As tentativas de conexao falham mas nao quebram os testes (mocks);
# esses loggers ficam mais quietos so pra nao poluir o output do build.
logging.level.org.mongodb.driver.cluster=OFF
logging.level.org.springframework.amqp.rabbit.listener=OFF
logging.level.org.apache.kafka=OFF

# auto-index-creation cria indices de forma sincrona/bloqueante ja no startup do
# MongoTemplate - sem Mongo real disponivel isso trava o contexto (WritableServerSelector
# timeout). Mantido true em local/homolog, desligado so aqui.
spring.data.mongodb.auto-index-creation=false
