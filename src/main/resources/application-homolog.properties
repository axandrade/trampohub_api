# src/main/resources/application-homolog.properties

spring.application.name=trampohub-api-homolog

# ========== Server Configuration ==========
server.port=8001

# Mongo (banco separado para homolog)
spring.mongodb.uri=mongodb://admin:${MONGO_PASSWORD:trampohub123}@${MONGO_HOST:localhost}:27018/trumpohub_db?authSource=admin

# Popula empresas/vagas de demonstracao no startup (idempotente, so roda em homolog)
app.seed-demo-data=true

# Tempo de vida do token
app.token-expiration-minutes=15

# Upload de foto de perfil
app.media.root=media
app.media.url-pattern=/media/**

# CORS para homolog
app.cors.allowed-origins=http://localhost:4200,http://localhost:4201

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.property-naming-strategy=SNAKE_CASE

# ========== RabbitMQ Configuration ==========
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5673
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=10000

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000

# ========== Kafka Configuration ==========
spring.kafka.bootstrap-servers=host.docker.internal:9092\
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:true}

# ========== Logging (mais detalhado) ==========
logging.level.root=INFO
logging.level.br.com.alexandrade.trampohub=DEBUG