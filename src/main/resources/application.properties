# src/main/resources/application.properties

spring.application.name=trampohub-api

# Autenticacao propria via TokenAuthenticationFilter - sem UserDetailsService,
# entao desabilita a geracao do usuario padrao (e o log da senha gerada)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ========== Server Configuration ==========
server.port=8080

# Mongo
spring.mongodb.uri=mongodb://admin:${MONGO_PASSWORD:trampohub123}@${MONGO_HOST:localhost}:27017/trampohub_java?authSource=admin

# Tempo de vida do token
app.token-expiration-minutes=15

# Upload de foto de perfil
app.media.root=media
app.media.url-pattern=/media/**

app.cors.allowed-origins=http://localhost:4200,http://localhost:4201,http://localhost:4001

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.property-naming-strategy=SNAKE_CASE

# ========== RabbitMQ Configuration ==========
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=10000

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000

# ========== Kafka Configuration ==========
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:9092

# Nao inicia os @KafkaListener automaticamente no dev local (sem broker rodando).
# Suba um Kafka e rode com -DKAFKA_ENABLED=true (ou variavel de ambiente) para ativar.
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:false}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=br.com.alexandrade.trampohub_api.event

