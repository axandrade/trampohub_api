# src/main/resources/application.properties

spring.application.name=trampohub-api

# Autenticacao propria via TokenAuthenticationFilter - sem UserDetailsService,
# entao desabilita a geracao do usuario padrao (e o log da senha gerada)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ========== Server Configuration ==========
server.port=8080

# Mongo
spring.mongodb.uri=mongodb://admin:${MONGO_PASSWORD:trampohub123}@${MONGO_HOST:localhost}:27017/trampohub_java?authSource=admin

# Tempo de vida do token
app.token-expiration-minutes=15

# Upload de foto de perfil
app.media.root=media
app.media.url-pattern=/media/**

app.cors.allowed-origins=http://localhost:4200,http://localhost:4201,http://localhost:4001

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.property-naming-strategy=SNAKE_CASE

# ========== RabbitMQ Configuration ==========
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=10000

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000

# ========== Logging ==========
logging.level.root=WARN
logging.level.br.com.alexandrade.trampohub=INFO