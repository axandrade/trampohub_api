spring.application.name=trampohub-api

# Mongo (mesma instancia usada pelo backend Python, banco separado para nao
# colidir com as collections vagas/candidaturas do Django, que usam tipos diferentes)
spring.mongodb.uri=mongodb://admin:${MONGO_PASSWORD:trampohub123}@${MONGO_HOST:localhost}:27017/trampohub_java?authSource=admin

# Tempo de vida do token emitido em /api/token/. Depois disso o token e
# invalidado e o usuario precisa fazer login novamente.
app.token-expiration-minutes=15

# Upload de foto de perfil
app.media.root=media
app.media.url-pattern=/media/**

app.cors.allowed-origins=http://localhost:4200,http://localhost:4201,http://localhost:4001

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.property-naming-strategy=SNAKE_CASE
